# =============================================================================
# Horizon proxy compose (trimmed: proxy only, optional TLS front)
# =============================================================================
# Pi account deployment:
#   1. Set strong proxy/service secrets and Postgres credentials in .env.
#   2. Start docker-compose.controlplane.yml, then this proxy stack.
#   3. Create an account key on Pi 4; configure X-Horizon-Proxy-Token in the tool.
# See deploy/ACCOUNT_ANALYTICS.md for the complete connection and deployment flow.
#
# The proxy listens on loopback only. The optional dashboard gateway below
# binds to the Pi 5 LAN address and exposes private account analytics and a
# provider operation allowlist. The proxy authenticates all tool requests.
#
# TLS front (VPS with a DNS name):
#   1. set HORIZON_PUBLIC_DOMAIN in .env (e.g. horizon.example.com)
#   2. docker compose --profile tls up -d
#   3. Caddy terminates TLS on 80/443 and obtains certificates automatically
#
# Account keys live in Postgres and are managed on Pi 4. The OSS keys.db/CLI
# remains available for standalone deployments with account integration disabled.
# =============================================================================

services:
  horizon-proxy:
    build:
      context: .
      args:
        HORIZON_BUILD_VERSION: ${HORIZON_BUILD_VERSION:-source-build}
    # Host networking (Linux): loopback confines the proxy data plane to Pi 5.
    network_mode: host
    command: ["--host", "127.0.0.1"]
    restart: unless-stopped
    environment:
      - HORIZON_HOST=127.0.0.1
      - HORIZON_PROXY_TOKEN=${HORIZON_PROXY_TOKEN:?set HORIZON_PROXY_TOKEN (see .env.example; e.g. openssl rand -hex 32)}
      - HOME=/home/nonroot
      - HORIZON_WORKSPACE_DIR=/home/nonroot/.horizon
      - HORIZON_CONFIG_DIR=/home/nonroot/.horizon/config
      - CONTEXTSHRINK_API_URL=${CONTEXTSHRINK_API_URL:-http://127.0.0.1:8788}
      # Cache keep-alive (horizon/proxy/cache_keeper.py): off unless .env sets 1.
      - HORIZON_CACHE_KEEPALIVE=${HORIZON_CACHE_KEEPALIVE:-0}
      # Cost features (wiki/plans/2026-10-08-cost-savings-research.md). One switch:
      # HORIZON_SAVINGS=auto turns on everything measured to save money, each with
      # automatic safety nets (horizon/proxy/savings_profile.py); max also swaps
      # superseded model ids. Default off. The variables below are left empty so
      # the profile decides; set any of them in .env to override it (0 = off).
      - HORIZON_SAVINGS=${HORIZON_SAVINGS:-off}
      - HORIZON_MODEL_MODERNIZE=${HORIZON_MODEL_MODERNIZE:-}
      - HORIZON_FAST_MODE_POLICY=${HORIZON_FAST_MODE_POLICY:-}
      - HORIZON_OPENAI_FLEX_POLICY=${HORIZON_OPENAI_FLEX_POLICY:-}
      - HORIZON_PRICE_CLIFF_GUARD=${HORIZON_PRICE_CLIFF_GUARD:-}
      # Flash Observations: large local tool outputs shown for one turn, then stubbed.
      - HORIZON_FLASH_OBSERVATIONS=${HORIZON_FLASH_OBSERVATIONS:-}
      - HORIZON_FLASH_OPENAI=${HORIZON_FLASH_OPENAI:-}
      - HORIZON_FLASH_GEMINI=${HORIZON_FLASH_GEMINI:-}
      # Stable cache-routing id for Grok when the client sends none.
      - HORIZON_CACHE_ROUTING=${HORIZON_CACHE_ROUTING:-}
      - HORIZON_FLASH_OPENAI_UPSTREAMS=${HORIZON_FLASH_OPENAI_UPSTREAMS:-}
      # Skip models whose cache reads cost under this fraction of input (no saving there).
      - HORIZON_FLASH_MIN_READ_RATIO=${HORIZON_FLASH_MIN_READ_RATIO:-0.04}
      # Telemetry: client-caused prompt-cache misses priced per cause in /stats.
      - HORIZON_CACHE_MISS_WATCH=${HORIZON_CACHE_MISS_WATCH:-}
      - CONTEXTSHRINK_SERVICE_TOKEN=${CONTEXTSHRINK_SERVICE_TOKEN:?set CONTEXTSHRINK_SERVICE_TOKEN}
    volumes:
      - horizon_workspace:/home/nonroot/.horizon
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:8787/readyz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  # LAN gateway for private analytics and authenticated provider operations.
  # Its Caddyfile binds only 192.168.0.71:8787 and forwards an explicit
  # allowlist. The account API validates sessions; the proxy validates tool keys.
  # Enable with: docker compose --profile dashboard up -d horizon-dashboard-gateway
  horizon-dashboard-gateway:
    image: caddy:2-alpine
    profiles: ["dashboard"]
    network_mode: host
    restart: unless-stopped
    volumes:
      - ./deploy/pi5-webtier/Caddyfile:/etc/caddy/Caddyfile:ro
    depends_on:
      - horizon-proxy

  # Optional TLS front. Activated with: docker compose --profile tls up -d
  # NOTE: with horizon-proxy in host-network mode, caddy must also use
  # network_mode: host and target 127.0.0.1:8787 (adjust the Caddyfile
  # upstream) when you enable this profile.
  caddy:
    image: caddy:2-alpine
    profiles: ["tls"]
    restart: unless-stopped
    environment:
      - HORIZON_PUBLIC_DOMAIN=${HORIZON_PUBLIC_DOMAIN:-}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - horizon-proxy

volumes:
  horizon_workspace:
  caddy_data:
  caddy_config:
