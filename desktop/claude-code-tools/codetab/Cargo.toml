[package]
name = "contextshrink-codetab"
version.workspace = true
edition.workspace = true
publish.workspace = true
description = "Sets up, repairs and removes ContextShrink's routing for the Claude Desktop Code tab (Windows)"

[[bin]]
name = "contextshrink-codetab"
path = "src/main.rs"

[dependencies]
serde_json = "1"
sha2 = "0.10"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_Security", "Win32_Storage_FileSystem", "Win32_System_Com", "Win32_System_Console", "Win32_UI_Shell"] }
