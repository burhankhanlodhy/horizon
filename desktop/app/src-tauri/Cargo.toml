[package]
name = "contextshrink-desktop"
version = "0.3.0"
description = "ContextShrink desktop launcher: run coding tools through the ContextShrink proxy"
authors = ["ContextShrink"]
edition = "2021"

# Standalone: not a member of the repo-root Horizon workspace.
[workspace]

[lib]
# The `_lib` suffix avoids a name clash with the bin target on Windows,
# see https://github.com/rust-lang/cargo/issues/8519
name = "contextshrink_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
keyring = { version = "3", features = ["windows-native"] }
which = "7"
dunce = "1"

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
