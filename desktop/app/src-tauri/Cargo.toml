[package]
name = "contextshrink-desktop"
version = "0.7.8"
description = "ContextShrink desktop launcher: run coding tools through the ContextShrink proxy"
authors = ["ContextShrink"]
edition = "2021"

# Standalone: not a member of the repo-root Horizon workspace.
[workspace]

[lib]
# The `_lib` suffix avoids a name clash with the bin target on Windows,
# see https://github.com/rust-lang/cargo/issues/8519
name = "contextshrink_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
which = "7"
dunce = "1"
tauri-plugin-single-instance = "2"

[target.'cfg(windows)'.dependencies]
keyring = { version = "3", features = ["windows-native"] }
# Removes the HKCU Run value older installs wrote. Registry API, not reg.exe.
windows-registry = "0.6"
# The sign-in Startup shortcut (IShellLinkW) and the known-folder lookup.
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_Com", "Win32_UI_Shell"] }

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3", features = ["apple-native"] }

# Secret Service over D-Bus (GNOME Keyring, KWallet). libdbus is vendored, so
# users need no extra package and the build needs no libdbus-1-dev.
[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3", features = ["sync-secret-service", "crypto-rust", "vendored"] }
# Same crate keyring uses, to create the default collection when it is missing.
dbus-secret-service = { version = "4.1", features = ["crypto-rust", "vendored"] }

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
