# Build the ContextShrink desktop app for macOS (Apple Silicon), Linux
# (x86_64) and Windows (x86_64), smoke-test the bundled client, and keep the
# packages as artifacts. The Windows installer is signed with Azure Artifact
# Signing once the repo variables in desktop/SIGNING.md are set.
#
# Runs on demand (Actions tab, or `gh workflow run desktop.yml`) and for tags
# named desktop-v*.
name: Desktop app

on:
  workflow_dispatch:
  push:
    tags: ["desktop-v*"]

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos:
    name: macOS (Apple Silicon)
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.18"
      - name: Rust toolchain (rust-toolchain.toml)
        run: rustup toolchain install
      - name: Build
        run: bash desktop/macos/build.sh
      - name: Smoke-test the bundled client
        run: |
          app=desktop/app/src-tauri/target/release/bundle/macos/ContextShrink.app
          python3 desktop/tests/smoke_client.py "$app/Contents/Resources/horizon/horizon"
      - uses: actions/upload-artifact@v4
        with:
          name: contextshrink-macos-arm64
          path: desktop/dist-macos/*
          if-no-files-found: error
          retention-days: 30

  linux:
    name: Linux (x86_64)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    # Ubuntu 22.04 keeps the packages compatible with 22.04, Debian 12,
    # Fedora 38 and newer.
    container: ubuntu:22.04
    steps:
      - name: Install git (for checkout)
        run: apt-get update -qq && apt-get install -y -qq git ca-certificates >/dev/null
      - uses: actions/checkout@v4
      - name: Install build dependencies
        run: bash desktop/linux/install-deps.sh
      - name: Build
        run: bash desktop/linux/build.sh
        env:
          # Signs the AppImage for the in-app updater; unset = unsigned build.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
      - name: Smoke-test the bundled client
        run: |
          apt-get install -y -qq gnome-keyring dbus-x11 >/dev/null
          dbus-run-session -- sh -c '
            printf "ci-throwaway" | gnome-keyring-daemon --unlock --components=secrets >/dev/null
            python3 desktop/tests/smoke_client.py desktop/client/dist/horizon/horizon'
      - uses: actions/upload-artifact@v4
        with:
          name: contextshrink-linux-x86_64
          path: desktop/dist-linux/*
          if-no-files-found: error
          retention-days: 30

  windows:
    name: Windows (x86_64)
    runs-on: windows-latest
    timeout-minutes: 120
    # The Azure federated credential trusts this environment only (desktop/SIGNING.md).
    environment: release
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Rust toolchain (rust-toolchain.toml)
        run: rustup toolchain install
      - name: Python venv for the frozen client (.venv, as build-client.ps1 expects)
        shell: pwsh
        run: |
          python -m venv .venv
          .\.venv\Scripts\python.exe -m pip install --upgrade pip
          .\.venv\Scripts\python.exe -m pip install -e ".[proxy,vault]" "pyinstaller>=6.10"
      - name: Build the Code-tab helpers (claude-code-tools)
        shell: pwsh
        working-directory: desktop/claude-code-tools
        run: cargo build --release --locked
      - name: .NET 8 runtime for the signing dlib
        if: vars.AZURE_CLIENT_ID != ''
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Azure sign-in (OIDC, no client secret)
        if: vars.AZURE_CLIENT_ID != ''
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Artifact Signing settings and client dlib
        if: vars.AZURE_CLIENT_ID != ''
        shell: pwsh
        env:
          SIGN_ENDPOINT: ${{ vars.ARTIFACT_SIGNING_ENDPOINT }}
          SIGN_ACCOUNT: ${{ vars.ARTIFACT_SIGNING_ACCOUNT }}
          SIGN_PROFILE: ${{ vars.ARTIFACT_SIGNING_PROFILE }}
        run: |
          $ErrorActionPreference = "Stop"
          $ProgressPreference = "SilentlyContinue"
          foreach ($n in "SIGN_ENDPOINT", "SIGN_ACCOUNT", "SIGN_PROFILE") {
              if (-not [Environment]::GetEnvironmentVariable($n)) { throw "Repo variable for $n is empty (see desktop/SIGNING.md)." }
          }
          # Pinned Artifact Signing Client Tools dlib (NuGet package Microsoft.ArtifactSigning.Client).
          $version = "1.0.146"
          $pkg = Join-Path $env:RUNNER_TEMP "ArtifactSigning"
          Invoke-WebRequest "https://www.nuget.org/api/v2/package/Microsoft.ArtifactSigning.Client/$version" -OutFile "$pkg.zip"
          Expand-Archive "$pkg.zip" -DestinationPath $pkg -Force
          $dlib = Join-Path $pkg "bin\x64\Azure.CodeSigning.Dlib.dll"
          if (-not (Test-Path $dlib)) { throw "Azure.CodeSigning.Dlib.dll not found in package $version" }
          "Dlib $version Authenticode status: $((Get-AuthenticodeSignature -LiteralPath $dlib).Status)"
          Add-Content -Path $env:GITHUB_ENV -Value "CS_SIGN_ENDPOINT=$env:SIGN_ENDPOINT"
          Add-Content -Path $env:GITHUB_ENV -Value "CS_SIGN_ACCOUNT=$env:SIGN_ACCOUNT"
          Add-Content -Path $env:GITHUB_ENV -Value "CS_SIGN_PROFILE=$env:SIGN_PROFILE"
          Add-Content -Path $env:GITHUB_ENV -Value "CS_SIGN_DLIB=$dlib"
      - name: Build the installer (desktop/build-installer.ps1)
        shell: pwsh
        run: .\desktop\build-installer.ps1
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
      - name: Smoke-test the bundled client
        shell: pwsh
        run: |
          $horizon = "desktop\client\dist\horizon\horizon.exe"
          & $horizon --version
          if ($LASTEXITCODE -ne 0) { throw "horizon --version failed" }
          & $horizon codetab --help | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "horizon codetab --help failed" }
      - name: Verify Authenticode signatures
        if: vars.AZURE_CLIENT_ID != ''
        shell: pwsh
        run: |
          $installer = @(Get-ChildItem -File "desktop\app\src-tauri\target\release\bundle\nsis\*.exe")
          if (-not $installer) { throw "No NSIS installer was built" }
          # The app exe as shipped, from inside the installer: after bundling, Tauri
          # leaves its own unpatched, unsigned copy in target\release.
          $unpacked = Join-Path $env:RUNNER_TEMP "nsis-check"
          & 7z x $installer[0].FullName "-o$unpacked" -y | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "Could not unpack $($installer[0].Name) to check it" }
          $app = @(Get-ChildItem $unpacked -Recurse -File -Filter "contextshrink-desktop.exe")
          if (-not $app) { throw "contextshrink-desktop.exe not found inside $($installer[0].Name)" }
          $files = @($app)
          # The shipped helpers only (target\release also holds test-only children).
          $files += @("claude-code-launcher.exe", "contextshrink-status.exe", "horizon.exe", "contextshrink-codetab.exe" |
              ForEach-Object { Get-Item -LiteralPath (Join-Path "desktop\claude-code-tools\target\release" $_) })
          $files += $installer
          $files += @(Get-ChildItem "desktop\client\dist\horizon" -Recurse -File -Include *.exe, *.dll, *.pyd)
          $bad = @($files | Where-Object { (Get-AuthenticodeSignature -LiteralPath $_.FullName).Status -ne "Valid" })
          "Checked $($files.Count) signed-candidate files"
          if ($bad) {
              $bad | ForEach-Object {
                  $sig = Get-AuthenticodeSignature -LiteralPath $_.FullName
                  "Not Valid: $($_.FullName): $($sig.Status) $($sig.StatusMessage)"
              }
              throw "$($bad.Count) file(s) do not have a valid signature"
          }
      - name: Report unsigned build
        if: vars.AZURE_CLIENT_ID == ''
        shell: pwsh
        run: Write-Output "::warning::unsigned build (AZURE_CLIENT_ID is not set; Artifact Signing skipped)"
      - name: Stage the installer for publish-installer.ps1
        shell: pwsh
        run: |
          $nsis = "desktop\app\src-tauri\target\release\bundle\nsis"
          New-Item -ItemType Directory -Force "desktop\dist-windows" | Out-Null
          Copy-Item "$nsis\*.exe" "desktop\dist-windows" -ErrorAction Stop
          Copy-Item "$nsis\*.exe.sig" "desktop\dist-windows" -ErrorAction SilentlyContinue
          Get-ChildItem "desktop\dist-windows" | ForEach-Object { "Staged $($_.Name)" }
      - uses: actions/upload-artifact@v4
        with:
          name: contextshrink-windows-x86_64
          path: desktop/dist-windows/*
          if-no-files-found: error
          retention-days: 7
      # The npx Code-tab tools (not bundled in the installer). publish-installer.ps1
      # -ClaudeCodeTools uploads these three files to R2 under claude-code-tools/<version>/.
      - name: Stage the Code-tab tools for publish-installer.ps1 (-ClaudeCodeTools)
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $bin = "desktop\claude-code-tools\target\release"
          $out = "desktop\dist-claude-code-tools"
          Remove-Item -Recurse -Force $out -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force $out | Out-Null
          # The version is the workspace version in desktop/claude-code-tools/Cargo.toml.
          $cargo = Get-Content "desktop\claude-code-tools\Cargo.toml" -Raw
          if ($cargo -notmatch '(?ms)^\[workspace\.package\]\s*\r?\nversion = "(\d+\.\d+\.\d+)"') {
              throw "No workspace version in desktop\claude-code-tools\Cargo.toml"
          }
          $version = $Matches[1]
          $files = [ordered]@{}
          foreach ($name in @("claude-code-launcher.exe", "contextshrink-codetab.exe")) {
              Copy-Item (Join-Path $bin $name) $out -ErrorAction Stop
              $copy = Join-Path $out $name
              if ($env:CS_SIGN_ENDPOINT) {
                  $sig = Get-AuthenticodeSignature -LiteralPath $copy
                  if ($sig.Status -ne "Valid") { throw "$name is not validly signed: $($sig.Status)" }
              } else {
                  Write-Output "::warning::$name is unsigned (Artifact Signing is not configured); publish-installer.ps1 will refuse it"
              }
              $files[$name] = [ordered]@{
                  sha256 = (Get-FileHash -LiteralPath $copy -Algorithm SHA256).Hash.ToLower()
                  size   = (Get-Item -LiteralPath $copy).Length
              }
          }
          $manifest = [ordered]@{ version = $version; files = $files }
          [IO.File]::WriteAllText((Join-Path $out "manifest.json"), ($manifest | ConvertTo-Json -Depth 4), (New-Object Text.UTF8Encoding $false))
          Get-ChildItem $out | ForEach-Object { "Staged $($_.Name)" }
      - uses: actions/upload-artifact@v4
        with:
          name: contextshrink-claude-code-tools-windows
          path: desktop/dist-claude-code-tools/*
          if-no-files-found: error
          retention-days: 7
